name: Docker build and smoke test

on:
  push:
    branches:
      - main
      - 'fix/docker-*'
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - scripts/smoke-docker.py
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - scripts/smoke-docker.py
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PORT: '11380'
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the service
        run: make docker-compose-up

      - name: Check HTTP startup and MCP protocol
        run: python3 scripts/smoke-docker.py

      - name: Show container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop the service
        if: always()
        run: docker compose down
