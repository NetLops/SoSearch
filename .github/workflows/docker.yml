name: Docker build and availability checks

on:
  push:
    branches:
      - main
      - 'fix/docker-*'
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - Makefile
      - Cargo.toml
      - Cargo.lock
      - src/**
      - scripts/smoke-docker.py
      - tests/docker-compose.ci.yml
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - Makefile
      - Cargo.toml
      - Cargo.lock
      - src/**
      - scripts/smoke-docker.py
      - tests/docker-compose.ci.yml
      - .github/workflows/docker.yml
  workflow_dispatch:
    inputs:
      live_search:
        description: Require real HTTP and MCP search results from public engines
        type: boolean
        default: true
      search_query:
        description: Query for the live search checks
        type: string
        default: rust programming language

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PORT: '11380'
      COMPOSE_FILE: docker-compose.yml:tests/docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the service
        run: make docker-compose-up

      - name: Check HTTP and MCP including offline searches
        run: python3 scripts/smoke-docker.py --offline-search --report artifacts/offline.json

      - name: Restart with access to public search engines
        if: github.event_name == 'workflow_dispatch' && inputs.live_search
        env:
          COMPOSE_FILE: docker-compose.yml
        run: docker compose up -d --force-recreate

      - name: Require real HTTP and MCP search results
        if: github.event_name == 'workflow_dispatch' && inputs.live_search
        env:
          COMPOSE_FILE: docker-compose.yml
          SEARCH_QUERY: ${{ inputs.search_query }}
        run: python3 scripts/smoke-docker.py --live-search --query "$SEARCH_QUERY" --report artifacts/live.json

      - name: Show container logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/container.log
          cat artifacts/container.log

      - name: Save availability reports and container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: availability-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn

      - name: Stop the service
        if: always()
        run: docker compose down --remove-orphans
